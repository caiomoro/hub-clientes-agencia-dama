<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linha editorial | RA.Gym</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="hero"><div class="kicker">LINHA EDITORIAL</div><div class="eyebrow">RESIDÊNCIA ATLÉTICA</div><h1>Outubro</h1><p>31 pautas para Feed, Reels e Stories.</p></header><section><div class="section-label">Calendário de pautas</div><div id="calendar" class="calendar"></div></section><footer>Planejamento editorial · 10COMPLICADO</footer></main><script>const types=['REEL','STORY','FEED'];const themes=['Comece sem ficar perdido','Atendimento próximo','Treino que cabe na rotina','Conheça a equipe','Dúvidas de iniciantes','Visita à academia','Musculação na fase adulta','Horários da semana','Bastidores da Residência Atlética','Convite para conhecer'];calendar.innerHTML=Array.from({length:31},(_,i)=>`<article class="editorial"><b>${String(i+1).padStart(2,'0')}</b><span>${types[i%3]}</span><h2>${themes[i%themes.length]}</h2><p>Conteúdo para aproximar, informar e convidar para uma visita.</p></article>`).join('')</script></body></html>
