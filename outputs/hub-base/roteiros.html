<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roteiros de anúncio | RA.Gym</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="hero"><div class="kicker">ROTEIROS A.I.A.</div><div class="eyebrow">RESIDÊNCIA ATLÉTICA</div><h1>Novos alunos</h1><p>Musculação com atenção de verdade. Toledo e região.</p></header><section class="quote"><b>ATENÇÃO</b><br>Cidade + dificuldade<br><br><b>INFORMAÇÃO E AÇÃO</b><br>Residência Atlética + próximo passo</section><section><div class="section-label">10 roteiros de anúncio</div><div id="cards" class="materials"></div></section><footer>Agência Dama - Assessoria de Marketing · Assessoria de Marketing para você faturar mais.</footer></main><script>const data=[['Começar sem ficar perdido','FALADO DIRETO','Você de Toledo e região, quer começar na musculação, mas não sabe por onde? Na Residência Atlética, você encontra atendimento próximo desde a chegada. Chame no WhatsApp e combine sua visita.'],['Voltar sem se comparar','FALADO DIRETO','Você quer voltar à musculação, mas trava na hora de recomeçar? Seu ponto de partida não precisa ser o ritmo de outra pessoa. Venha conhecer a equipe.'],['Um lugar para começar na fase adulta','CENAS + LOCUÇÃO','Academia também é para quem começa na fase adulta. Conheça um espaço com acolhimento, musculação e atenção às suas dúvidas.'],['Começar depois dos 50','FALADO DIRETO','Pensa em começar depois dos 50, mas não sabe onde se sentir à vontade? Veja o ambiente e conheça quem vai receber você.'],['O treino precisa caber na agenda','CENAS + LOCUÇÃO','Quer treinar, mas a rotina aperta? Segunda a sexta, das 6h às 22h, e sábado, das 8h às 12h. Confirme o funcionamento em feriados.'],['Não precisa fingir que sabe','FALADO DIRETO','Adia a musculação porque não conhece os aparelhos? Ser iniciante não é problema. Aqui você pode perguntar e começar com tranquilidade.'],['Atendimento que dá para conhecer','CENAS + LOCUÇÃO','Procura uma academia onde suas dúvidas não fiquem de lado? Conheça o atendimento da Residência Atlética de perto.'],['Compare mais do que o preço','FALADO DIRETO','O preço sozinho não resolve sua dúvida. Compare localização, horários, ambiente e atendimento antes de decidir.'],['O primeiro passo pode ser uma visita','FALADO DIRETO','Quer começar, mas está esperando companhia? Venha conhecer o espaço e ser recebido pela equipe.'],['Conheça antes de decidir','CENAS + LOCUÇÃO','Ainda não encontrou sua academia? Veja o espaço, conheça a equipe e decida com a academia na sua frente.']];cards.innerHTML=data.map((x,i)=>`<article class="card"><b>0${i+1}</b><small>${x[1]}</small><h2>${x[0]}</h2><p>${x[2]}</p><button onclick="navigator.clipboard.writeText(${JSON.stringify(x[2])})">Copiar roteiro</button></article>`).join('')</script></body></html>
