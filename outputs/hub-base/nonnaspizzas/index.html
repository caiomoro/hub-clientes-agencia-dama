<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub do cliente | Nonna Pizzas</title><link rel="stylesheet" href="/nonnaspizzas/styles.css"></head><body><main class="shell"><header class="hero"><div class="kicker">PIZZARIA ARTESANAL</div><img id="logo" class="logo" alt="Logo da Nonna Pizzas"><div id="eyebrow" class="eyebrow"></div><h1 id="name"></h1><p id="tagline"></p><div id="tags" class="tags"></div></header><section><div class="section-label">Materiais do cliente</div><div id="materials" class="materials"></div></section><section class="location"><div class="section-label">Unidades</div><div id="units"></div><a id="whatsapp" class="whatsapp" target="_blank" rel="noopener">Falar com a Nonna <span>↗</span></a></section><footer><div class="agency-mark">Agência Dama - Assessoria de Marketing</div><p>Assessoria de Marketing para você faturar mais.</p></footer></main><script src="/nonnaspizzas/config.js"></script><script src="/script.js"></script><script>const c=window.CLIENT_CONFIG;document.querySelector('#logo').src='/nonnaspizzas/'+c.brand.logo.replace(/^assets\//,'assets/');document.querySelector('#units').innerHTML=(c.units||[]).map(u=>`<p><strong>${u.name}</strong><br>${u.address}<br>${u.phone||''}<br><a href="${u.order}" target="_blank" rel="noopener">Fazer pedido</a> · <a href="${u.instagram}" target="_blank" rel="noopener">Instagram</a></p>`).join('');</script></body></html>
